<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head}"></head>
  <body>
    <div th:replace="~{fragments/layout :: navigation}"></div>
    <div class="shell">
      <main class="main">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <a class="back" th:href="@{/{s}(s=${secao})}"
          ><span
            th:text="${'Voltar para ' + #strings.toLowerCase(titulo)}"
          ></span
        ></a>
        <div class="page-heading">
          <div>
            <h1>
              <span
                th:text="${(id == null ? 'Novo ' : 'Editar ') + singular}"
              ></span>
            </h1>
          </div>
        </div>
        <div class="form-layout">
          <section class="panel">
            <div class="panel-head">
              <div>
                <h2>Informações do cadastro</h2>
                <p>Os campos com * são obrigatórios.</p>
              </div>
            </div>
            <form
              method="post"
              th:action="${id == null} ? @{/{s}(s=${secao})} : @{/{s}/{id}(s=${secao},id=${id})}"
              th:object="${form}"
            >
              <div class="form-body">
                <div
                  class="alert error"
                  role="alert"
                  th:if="${#fields.hasAnyErrors()}"
                >
                  <div
                    th:each="error : ${#fields.allErrors()}"
                    th:text="${error}"
                  ></div>
                </div>
                <div class="field">
                  <label for="nome">Nome <span>*</span></label
                  ><input
                    id="nome"
                    th:field="*{nome}"
                    required
                    maxlength="120"
                    placeholder="Informe o nome"
                    autofocus
                  />
                </div>
                <div class="field" th:if="${tipo == 'cpf'}">
                  <label for="cpf">CPF <span>*</span></label
                  ><input
                    id="cpf"
                    th:field="*{cpf}"
                    required
                    maxlength="14"
                    inputmode="numeric"
                    data-cpf
                    placeholder="000.000.000-00"
                    aria-describedby="cpf-hint"
                  /><small id="cpf-hint"
                    >Informe os 11 dígitos. Você pode usar ou omitir a
                    pontuação.</small
                  >
                </div>
                <div class="field" th:if="${tipo == 'preco'}">
                  <label for="preco">Preço unitário em R$ <span>*</span></label
                  ><input
                    id="preco"
                    th:field="*{preco}"
                    required
                    type="number"
                    min="0.01"
                    max="9999999999.99"
                    step="0.01"
                    placeholder="0,00"
                    aria-describedby="preco-hint"
                  /><small id="preco-hint"
                    >Valor por unidade, com até duas casas decimais.</small
                  >
                </div>
              </div>
              <div class="form-actions">
                <a class="btn secondary" th:href="@{/{s}(s=${secao})}"
                  >Cancelar</a
                ><button class="btn" type="submit">Salvar cadastro</button>
              </div>
            </form>
          </section>
        </div>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
      </main>
    </div>
  </body>
</html>
