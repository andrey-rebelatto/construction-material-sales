<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
    <title
      th:text="${titulo != null ? titulo + ' - Sistema de vendas' : 'Sistema de vendas'}"
    >
      Sistema de vendas
    </title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script th:src="@{/js/app.js}" defer></script>
  </head>
  <body>
    <header class="site-header" th:fragment="navigation">
      <div class="container">
        <p class="site-title">Sistema de vendas de materiais de construção</p>
        <nav aria-label="Menu principal">
          <a
            th:href="@{/}"
            th:classappend="${secao == 'inicio' ? 'active' : ''}"
            >Início</a
          >
          <a
            th:href="@{/clientes}"
            th:classappend="${secao == 'clientes' ? 'active' : ''}"
            >Clientes</a
          >
          <a
            th:href="@{/vendedores}"
            th:classappend="${secao == 'vendedores' ? 'active' : ''}"
            >Vendedores</a
          >
          <a
            th:href="@{/produtos}"
            th:classappend="${secao == 'produtos' ? 'active' : ''}"
            >Produtos</a
          >
          <a
            th:href="@{/vendas}"
            th:classappend="${secao == 'vendas' ? 'active' : ''}"
            >Vendas</a
          >
        </nav>
      </div>
    </header>
    <div th:fragment="alerts">
      <div
        class="alert success"
        role="status"
        th:if="${sucesso}"
        th:text="${sucesso}"
      ></div>
      <div
        class="alert error"
        role="alert"
        th:if="${erro}"
        th:text="${erro}"
      ></div>
    </div>
    <footer class="footer" th:fragment="footer">
      Trabalho acadêmico - Spring MVC, Thymeleaf e Spring Data JPA
    </footer>
  </body>
</html>
