<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head}"></head>
  <body>
    <div th:replace="~{fragments/layout :: navigation}"></div>
    <div class="shell">
      <main class="main">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="page-heading">
          <div>
            <h1>Vendas</h1>
          </div>
          <a class="btn" th:href="@{/vendas/nova}"> Nova venda</a>
        </div>
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>Histórico de vendas</h2>
              <p>Da mais recente para a mais antiga.</p>
            </div>
            <span
              class="tag"
              th:text="${#lists.size(vendas) + ' venda(s)'}"
            ></span>
          </div>
          <div class="table-scroll" th:unless="${#lists.isEmpty(vendas)}">
            <table>
              <thead>
                <tr>
                  <th>Venda</th>
                  <th>Cliente</th>
                  <th>Data</th>
                  <th>Total</th>
                  <th><span class="muted">Detalhes</span></th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="venda : ${vendas}">
                  <td>
                    <a
                      class="id"
                      th:href="@{/vendas/{id}(id=${venda.id})}"
                      th:text="${'#' + #numbers.formatInteger(venda.id, 4)}"
                    ></a>
                  </td>
                  <td>
                    <strong th:text="${venda.cliente.nome}"></strong
                    ><small th:text="${venda.vendedor.nome}"></small>
                  </td>
                  <td
                    th:text="${#temporals.format(venda.dataHora, 'dd/MM/yyyy')}"
                  ></td>
                  <td class="amount" th:text="${@fmt.moeda(venda.total)}"></td>
                  <td>
                    <a
                      class="action"
                      th:href="@{/vendas/{id}(id=${venda.id})}"
                      th:aria-label="${'Ver venda ' + venda.id}"
                      >Detalhes</a
                    >
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="empty" th:if="${#lists.isEmpty(vendas)}">
            <h3>Nenhuma venda cadastrada</h3>
            <p>Clique em Nova venda para cadastrar.</p>
            <a class="btn" th:href="@{/vendas/nova}"> Nova venda</a>
          </div>
          <div class="table-foot">
            Abra uma venda para consultar os itens, editar ou excluir.
          </div>
        </section>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
      </main>
    </div>
  </body>
</html>
