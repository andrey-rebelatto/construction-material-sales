<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head}"></head>
  <body>
    <div th:replace="~{fragments/layout :: navigation}"></div>
    <div class="shell">
      <main class="main">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="page-heading">
          <div>
            <h1>
              <span
                th:text="${status == 404 ? 'Página não encontrada' : 'Não foi possível concluir'}"
              ></span>
            </h1>
            <p>
              O registro pode ter sido removido ou o endereço pode estar
              incorreto.
            </p>
          </div>
        </div>
        <section class="panel empty">
          <h3
            th:text="${status == 404 ? 'Registro não encontrado' : 'Tente novamente'}"
          ></h3>
          <p>Volte ao início para continuar usando o sistema.</p>
          <a class="btn" th:href="@{/}"> Ir para o início</a>
        </section>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
      </main>
    </div>
  </body>
</html>
