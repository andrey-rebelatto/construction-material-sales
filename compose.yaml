services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: construa
      POSTGRES_USER: construa
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U construa"]
      interval: 5s
      retries: 10
volumes:
  postgres-data:
